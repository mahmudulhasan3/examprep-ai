name: examprep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: examprep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: examprep
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examprep -d examprep"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the database is reached by its service name, not localhost.
      DATABASE_URL: postgresql://examprep:${POSTGRES_PASSWORD}@db:5432/examprep
      INIT_DB_ON_START: "true"
      APP_BASE_URL: http://localhost:${UI_PORT:-8502}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    restart: unless-stopped
    environment:
      EXAMPREP_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8502}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # Run the tests inside Docker:  docker compose --profile test run --rm test
  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  pgdata: